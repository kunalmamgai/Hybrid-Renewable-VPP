name: hybrid-renewable-vpp

# Production-style local stack: Postgres + FastAPI backend + nginx-served frontend.
# Set JWT_SECRET_KEY (and optionally GOOGLE_CLIENT_ID / VITE_GOOGLE_CLIENT_ID)
# in a root `.env` file or your shell before running `docker compose up`.
#
#   JWT_SECRET_KEY=<python -c "import secrets; print(secrets.token_hex(32))">

services:
  db:
    image: postgres:16-alpine
    container_name: vpp-db
    environment:
      POSTGRES_USER: surya
      POSTGRES_PASSWORD: surya
      POSTGRES_DB: surya
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U surya -d surya"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  backend:
    build: .
    container_name: vpp-backend
    ports:
      - "8000:8000"
    environment:
      ENVIRONMENT: production
      DATABASE_URL: postgresql+asyncpg://surya:surya@db:5432/surya
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:?JWT_SECRET_KEY must be set (see .env.example)}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:8080,http://localhost:5173}
    depends_on:
      db:
        condition: service_healthy
    # Migrations run automatically in the container entrypoint (alembic upgrade head)
    restart: unless-stopped

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
      args:
        VITE_API_URL: http://localhost:8000
        VITE_WS_URL: ws://localhost:8000
        VITE_GOOGLE_CLIENT_ID: ${VITE_GOOGLE_CLIENT_ID:-}
    container_name: vpp-frontend
    ports:
      - "8080:80"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

volumes:
  pgdata:
