name: hybrid-renewable-vpp
version: "1.0"
services:
  backend:
    build: .
    container_name: vpp-backend
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=sqlite+aiosqlite:///./vpp.db
      - SIMULATOR_TIME_SCALE=60.0
    volumes:
      - ./vpp.db:/app/vpp.db
    restart: unless-stopped

  frontend:
    build: ./frontend
    container_name: vpp-frontend
    ports:
      - "5173:5173"
    environment:
      - VITE_API_URL=http://localhost:8000
    depends_on:
      - backend
    restart: unless-stopped
